name: Build Windows Executable

on:
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Also build on pushes to desktop-app (optional — remove if you only want manual)
  push:
    branches: [desktop-app]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller AWAREKeyboardViewer.spec

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWAREKeyboardViewer-Windows
          path: dist/AWAREKeyboardViewer.exe
          if-no-files-found: error
